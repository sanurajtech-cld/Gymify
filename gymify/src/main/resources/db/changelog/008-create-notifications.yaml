databaseChangeLog:
  - changeSet:
      id: 008-create-notifications
      author: gymify
      changes:
        - createTable:
            tableName: user_devices
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: device_token
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: device_type
                  type: varchar(20)
              - column:
                  name: device_name
                  type: varchar(100)
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: user_devices
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_devices_user
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: user_devices
            columnNames: user_id, device_token
            constraintName: uk_user_devices_token

        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
              - column:
                  name: data
                  type: jsonb
              - column:
                  name: is_read
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: read_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_user
            onDelete: CASCADE

        - createTable:
            tableName: notification_preferences
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: workout_reminders
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: membership_alerts
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: plan_updates
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: promotional
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: reminder_time
                  type: time
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: notification_preferences
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notification_preferences_user
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: notification_preferences
            columnNames: user_id
            constraintName: uk_notification_preferences_user

        - createIndex:
            tableName: user_devices
            indexName: idx_user_devices_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_read
            columns:
              - column:
                  name: is_read
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_created
            columns:
              - column:
                  name: created_at
