$kind: http-example
request:
  url: "{{baseUrl}}/users/me/password"
  method: PUT
  headers:
    Authorization: Bearer {{accessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "currentPassword": "password123",
          "newPassword": "newpass123"
      }
